name: publish-skill
# Rebuilds the skill zip on every push to main and attaches it to the "skill"
# release, so this URL always serves the latest version:
# https://github.com/vinmisra/work-agent/releases/download/skill/work-agent-skill.zip
on:
  push:
    branches: [main]
    paths: ["skill/**", "scripts/build-skill-zip.sh"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: bash scripts/build-skill-zip.sh dist/work-agent-skill.zip
      - name: Publish to the "skill" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view skill >/dev/null 2>&1; then
            gh release create skill --title "Work agent skill" --latest \
              --notes "Download work-agent-skill.zip and upload it at claude.ai, Settings, Capabilities, Skills. Rebuilt on every change to main."
          fi
          gh release upload skill dist/work-agent-skill.zip --clobber
